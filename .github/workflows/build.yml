name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -q FakePlayerPro.zip
      - run: mvn -B package
        working-directory: FakePlayerPro
      - uses: actions/upload-artifact@v4
        with:
          name: FakePlayerPro
          path: FakePlayerPro/target/FakePlayerPro-*.jar
